[project]
name = "dunneflow"
version = "0.3.0"
description = "DunneFlow — maps what moves through a program: entrypoints, flows, routines, and boundaries."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md", "licenses/*"]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
dunneflow = "dunneflow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pyinstaller>=6.22.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dunneflow"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# The `S` rules below are the ones that name a construct this tool must never contain when
# it reads somebody else's tree: `exec`, `pickle` and `marshal`, an XML parser that expands
# entities, an unsafe YAML load, a weak hash, a shell. Selected by number rather than as
# `S`, and the rest were looked at on 2026-11-12 rather than skipped: `S608` flags 65
# statements in `src/` that interpolate a table name, a column list, a row of `?` or
# `mirror.key_of`'s `[a-z0-9]` and no value from a request or a tree; `S603` and `S607` flag
# every toolchain started by name, which is what a reader does (`ingest/worker.py` says in
# what directory and environment); `S101` is every test. The `# noqa: S603` comments
# already in the tree are kept as the note each one is.
select = ["E", "F", "I", "UP", "B", "SIM",
          "S102", "S103", "S113", "S201", "S202", "S301", "S302", "S306", "S307", "S314",
          "S324", "S501", "S506", "S602", "S604", "S605", "S609", "S612", "S701"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# `uv run mypy .` is the gate CLAUDE.md prescribes, and `.` overrides `files` above. Once a
# build exists, `dist/` holds a *copy* of this package — the spec bundles both extractor trees
# and the detectors' loader as data, so `core_fingerprint()` has files to hash — and mypy
# finds two modules with one name and stops before checking anything at all. The artifact is
# not source.
exclude = '^(dist|build|\.venv-universal)/'
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Tests assert behaviour; annotating every fixture parameter would obscure that
# without catching anything.
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Pillow is never installed in the checked environment and is not meant to be: the icon
# scripts are run on demand with `uv run --with pillow`, because nothing the application
# ships needs an image library and adding one to the project environment would put it in
# the bundle. So the import is genuinely absent here rather than merely unstubbed.
module = "PIL.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
