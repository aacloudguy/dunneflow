# Structured markers mined out of comments and docstrings, in any language.
#
# Comments are where WHY lives. Most of a comment is prose, but some of it is
# load-bearing reference: a governance plan, an audit lock, a warning about a
# caveat that the code cannot express. Those are promoted to first-class,
# filterable annotations so questions like "show me everything governed by
# Plan 15-03, and every boundary it touches" become answerable.
#
# Patterns are Python regexes. The first capture group, when present, is the
# value; otherwise the whole match is.

version: 1

patterns:
  - kind: PLAN
    regex: '\b(Plan \d{2}-\d{2})\b'
  - kind: DECISION
    regex: '\b(D-\d{2}-\d{2}-\d+)\b'
  - kind: AUDIT_LOCK
    regex: '\b(Audit-locked)\b'
  - kind: ADR
    regex: '\b(ADR-\d+)\b'
  - kind: ISSUE
    regex: '\b(ISS-\d+)\b'
  - kind: GATE
    regex: '\b(G\d+)\b(?=[\s.,)]|$)'
  - kind: WARNING
    regex: '\b(WARNING|CAUTION|DANGER|IMPORTANT|SECURITY)\b\s*:?'
  - kind: TODO
    regex: '\b(TODO|FIXME|XXX|HACK)\b\s*:?'
  # A bare LETTERS-DIGITS pattern is rule 5's failure in a new place: it matches every
  # standard, cipher and encoding a program names. SHA-256, UTF-8, ISO-8601, RFC-3161 and
  # IEEE-29148 accounted for 121 phantom tickets on Mensores, found by joining code
  # annotations against the same ids in project documentation. The denylist is
  # evidence-led, not guessed, and extended with the standards bodies most likely to
  # appear elsewhere.
  #
  # Blind spot: a project that genuinely tracks work as "ISO-14" loses those annotations.
  # Precision is the right trade -- a false governance link claims traceability that does
  # not exist.
  - kind: TICKET
    regex: '\b(?!(?:SHA|UTF|IEEE|RFC|ISO|ANSI|NIST|FIPS|PKCS|ASN|AES|RSA|HMAC|PBKDF|ECDSA|TLS|SSL|HTTP|IPV|UTS|UAX)-)([A-Z]{2,10}-\d+)\b'

# --------------------------------------------------------------------------- #
# A document's own identity, for corpora that never write it in prose.
#
# `68-03-PLAN.md` declares itself as `phase: 68-front-door-extraction` and `plan: 03`
# in YAML frontmatter, and the string `Plan 68-03` appears nowhere in the corpus. The
# document plainly exists; the traceability join could not see it, and reported the
# work as built against no plan. 15 of 29 such findings on Mensores were this.
#
# Every id composed here is INFERRED, never CERTAIN. The document does not say this in
# words -- the tool assembled it from a naming convention, and a convention can be
# wrong, changed, or not the one in force when that file was written. Rule 6: never
# blur the two. The report shows the two tiers separately and can hide this one.
#
# Each rule gathers ordered parts, applies `part` to each to pull its number, and fills
# `format`. A part that does not match yields no id at all -- half an id is not an id.
#   frontmatter: keys read from the document's own frontmatter, in order.
#   filename:    a regex over the basename whose groups are the parts, in order.
# Both may be given; they corroborate, and either alone is enough.
document_identity:
  - kind: PLAN
    format: "Plan {0:0>2}-{1:0>2}"
    # One pattern per part, applied positionally. Mensores writes `plan:` two ways --
    # `plan: "1"` and `plan: "06-02"` -- so the plan segment must take the LAST number
    # and the phase segment the first. A single pattern read `06-02` as `06` and
    # composed `Plan 06-06`, an id that does not exist. Rule 1: a false trace is worse
    # than a missing one, and this one was invented by the rule meant to recover them.
    part: ['^0*(\d+)', '(\d+)\s*$']
    frontmatter: [phase, plan]
    # `85-08.1-PLAN.md` is a sub-plan of `Plan 85-08`; the code-side vocabulary has no
    # form for the third segment, so it is deliberately not captured.
    filename: '^(\d+)-(\d+)(?:\.\d+)?-[A-Z]+\.(?:md|rst|txt)$'
