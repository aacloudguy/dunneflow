# Extraction rules for Go.
#
# Read **in this process** and handed to the reader over the wire
# (`detectors.rules_document`), like TypeScript's: the reader is a Go program and must not
# carry its own copy, and this file is in Go's extraction stamp so an edit re-reads every
# Go file and costs the other languages nothing.
#
# Rules are matched against the **dotted form** of a call (`ingest/dotted.py`), the same
# contract as every other reader's.
#
# **The package name is what a Go rule matches, and that is rule 4.** A Go call is written
# through the package's local name (`os.Getenv`, `http.Get`), and this reader never expands
# an import, so a rule names the package as it is written. A file that renames an import
# (`import stdhttp "net/http"`) is spelled `stdhttp.Get` and is not matched: the residue is
# real and small, because renaming the standard library is rare and `goimports` never does it.
#
# **A bare method name is declared only where it is specific to its kind** (rule 5).
# `QueryContext` and `ExecContext` are `database/sql`'s and nobody else's; bare `Query`,
# `Exec`, `Read` and `Write` are on half the types in any module and are deliberately not
# here. The SQL itself is still found: a string that reads as SQL is judged by the host
# (`ingest/literals.py`) whatever called it.
#
# **A method is also matched by its receiver's type, where the type is declared below**
# (`typed_packages`, `plugins/go/typed.go`). `r.ReadFile(name)` is spelled `os.Root.ReadFile`
# when the checker says `r` is an `*os.Root`, and only then: a type of the program's own with
# a `ReadFile` method is not, whatever its variable is called (rule 30). A typed spelling is
# matched against `exact` entries only, and it is the evidence, so it cannot be mistaken for
# the package function. A function of a declared package, or a typed method, **taken as a
# value** (`var lchown = (*os.Root).Lchown`, `f := r.Chmod`) is a touch where it is taken,
# with `taken as a value` in its evidence, because the call that follows names nothing.

version: 1

boundaries:
  # -- environment ------------------------------------------------------------ #
  - kind: ENV
    direction: IN
    salience: high
    exact: [os.Getenv, os.LookupEnv, os.Environ, os.ExpandEnv, syscall.Getenv]
    target_arg: 0
  - kind: ENV
    direction: OUT
    salience: high
    exact: [os.Setenv, os.Unsetenv, os.Clearenv]
    target_arg: 0

  # -- files ------------------------------------------------------------------ #
  # `os.Root` (Go 1.24, most of it 1.25) is each package function again, confined to one
  # directory, so each method takes the package function's kind and direction. `Name` and
  # `Close` touch nothing and are not here. `os.OpenRoot` opens a directory to read through.
  - kind: FILE
    direction: IN
    salience: high
    exact: [os.Open, os.ReadFile, os.ReadDir, os.Stat, os.Lstat, os.DirFS, os.Readlink,
            os.OpenRoot, os.OpenInRoot,
            ioutil.ReadFile, ioutil.ReadDir, ioutil.ReadAll,
            filepath.Walk, filepath.WalkDir, filepath.Glob, fs.ReadFile, fs.WalkDir,
            fs.ReadDir, embed.FS,
            os.Root.Open, os.Root.OpenRoot, os.Root.ReadFile, os.Root.Stat, os.Root.Lstat,
            os.Root.Readlink, os.Root.FS]
    target_arg: 0
  - kind: FILE
    direction: OUT
    salience: high
    exact: [os.Create, os.WriteFile, os.Remove, os.RemoveAll, os.Mkdir, os.MkdirAll,
            os.MkdirTemp, os.CreateTemp, os.Rename, os.Chmod, os.Chown, os.Lchown,
            os.Chtimes, os.Truncate, os.Symlink, os.Link,
            ioutil.WriteFile, ioutil.TempFile, ioutil.TempDir,
            os.Root.Create, os.Root.WriteFile, os.Root.Mkdir, os.Root.MkdirAll,
            os.Root.Remove, os.Root.RemoveAll, os.Root.Rename, os.Root.Link,
            os.Root.Symlink, os.Root.Chmod, os.Root.Chown, os.Root.Lchown, os.Root.Chtimes]
    target_arg: 0
  - kind: FILE
    direction: BOTH
    salience: high
    exact: [os.OpenFile, os.Root.OpenFile]
    target_arg: 0

  # -- processes -------------------------------------------------------------- #
  # **Another process, and never this one ending.** `os.Exit` was here and was 714 of
  # beads' 5,891 touches: it stops the program and touches nothing outside it, which is
  # why Python's rules have never listed `sys.exit` (rule 24). `exec.LookPath` searches
  # `PATH` and starts nothing, and went with it.
  - kind: PROCESS
    direction: BOTH
    salience: high
    exact: [exec.Command, exec.CommandContext, syscall.Exec, os.StartProcess, syscall.Kill]
    target_arg: 0

  # -- local IPC -------------------------------------------------------------- #
  # **A Unix-domain socket is another process on this machine, never the network.**
  # `net.Dial` and `net.Listen` are both, decided by the network argument, so the
  # conditioned rules come first (first match wins) and the NETWORK rules below catch the
  # rest. A network argument that is not a literal -- `net.Dial(network, addr)` -- cannot
  # be decided: it stays NETWORK and says so (`undecided`). The target is the address,
  # which for a Unix socket is its path. `net.DialUnixgram` is not a Go function.
  - kind: LOCAL_IPC
    direction: IN
    salience: high
    exact: [net.Listen, net.ListenPacket]
    when_arg: {index: 0, in: [unix, unixgram, unixpacket]}
    undecided: "the network argument is not a literal, so a Unix-domain socket here reads as NETWORK"
    target_arg: 1
  - kind: LOCAL_IPC
    direction: OUT
    salience: high
    exact: [net.Dial, net.DialTimeout]
    when_arg: {index: 0, in: [unix, unixgram, unixpacket]}
    undecided: "the network argument is not a literal, so a Unix-domain socket here reads as NETWORK"
    target_arg: 1
  # The same two decisions made through a `net.Dialer` or a `net.ListenConfig`, typed by
  # receiver. `DialContext(ctx, network, address)` puts the network second.
  - kind: LOCAL_IPC
    direction: OUT
    salience: high
    exact: [net.Dialer.Dial]
    when_arg: {index: 0, in: [unix, unixgram, unixpacket]}
    undecided: "the network argument is not a literal, so a Unix-domain socket here reads as NETWORK"
    target_arg: 1
  - kind: LOCAL_IPC
    direction: OUT
    salience: high
    exact: [net.Dialer.DialContext]
    when_arg: {index: 1, in: [unix, unixgram, unixpacket]}
    undecided: "the network argument is not a literal, so a Unix-domain socket here reads as NETWORK"
    target_arg: 2
  - kind: LOCAL_IPC
    direction: IN
    salience: high
    exact: [net.ListenConfig.Listen, net.ListenConfig.ListenPacket]
    when_arg: {index: 1, in: [unix, unixgram, unixpacket]}
    undecided: "the network argument is not a literal, so a Unix-domain socket here reads as NETWORK"
    target_arg: 2
  - kind: LOCAL_IPC
    direction: IN
    salience: high
    exact: [net.ListenUnix, net.ListenUnixgram]
    target_arg: 1
    target_field: Name
  - kind: LOCAL_IPC
    direction: OUT
    salience: high
    exact: [net.DialUnix]
    target_arg: 2
    target_field: Name
  # `*net.UnixConn` and `*net.UnixListener`'s own methods. Each name is that type's and
  # nobody else's in the standard library, which is what makes a bare method safe (rule 5).
  - kind: LOCAL_IPC
    direction: IN
    salience: high
    method: [ReadMsgUnix]
    note: can pass file descriptors (SCM_RIGHTS)
  - kind: LOCAL_IPC
    direction: OUT
    salience: high
    method: [WriteMsgUnix]
    note: can pass file descriptors (SCM_RIGHTS)
  - kind: LOCAL_IPC
    direction: IN
    salience: high
    method: [AcceptUnix, ReadFromUnix]
  - kind: LOCAL_IPC
    direction: OUT
    salience: high
    method: [WriteToUnix]
  # A raw socket, only where its family is written as the Unix one.
  - kind: LOCAL_IPC
    direction: BOTH
    salience: high
    exact: [syscall.Socket, unix.Socket]
    when_arg: {index: 0, in: [syscall.AF_UNIX, unix.AF_UNIX, syscall.AF_LOCAL, unix.AF_LOCAL]}
  # **Who is on the other end**, which only a Unix-domain socket can answer: Linux's
  # `SO_PEERCRED`, Darwin's `LOCAL_PEERCRED`, and the peer's pid on Darwin.
  - kind: LOCAL_IPC
    direction: IN
    salience: high
    exact: [unix.GetsockoptUcred, unix.GetsockoptXucred, unix.GetsockoptInt]
    when_arg:
      index: 2
      in: [unix.SO_PEERCRED, unix.LOCAL_PEERCRED, unix.LOCAL_PEERPID, unix.LOCAL_PEEREPID,
           syscall.SO_PEERCRED]
    note: peer credentials

  # -- network ---------------------------------------------------------------- #
  - kind: NETWORK
    direction: OUT
    salience: high
    exact: [http.Get, http.Post, http.PostForm, http.Head, http.NewRequest,
            http.NewRequestWithContext, net.Dial, net.DialTimeout, net.DialTCP, net.DialUDP,
            tls.Dial, grpc.Dial, grpc.DialContext, grpc.NewClient, websocket.Dial]
    target_arg: 0
  # Typed, so their own rules: each puts its address at a different index. They make no
  # `net_calls` row, because `network.libraries` is keyed by the spelling a file writes.
  - kind: NETWORK
    direction: OUT
    salience: high
    exact: [net.Dialer.Dial]
    target_arg: 1
  - kind: NETWORK
    direction: OUT
    salience: high
    exact: [net.Dialer.DialContext]
    target_arg: 2
  - kind: NETWORK
    direction: IN
    salience: high
    exact: [net.ListenConfig.Listen, net.ListenConfig.ListenPacket]
    target_arg: 2
  - kind: NETWORK
    direction: IN
    salience: high
    exact: [http.ListenAndServe, http.ListenAndServeTLS, http.Serve, http.ServeTLS,
            net.Listen, net.ListenTCP, net.ListenUDP, net.ListenPacket, tls.Listen]
    method: [ListenAndServe, ListenAndServeTLS]
    target_arg: 0

  # -- databases -------------------------------------------------------------- #
  - kind: DATABASE
    direction: BOTH
    salience: high
    exact: [sql.Open, sql.OpenDB, sqlx.Open, sqlx.Connect, pgx.Connect, pgxpool.New,
            pgxpool.Connect, gorm.Open, redis.NewClient, mongo.Connect, bolt.Open,
            badger.Open]
    method: [QueryContext, QueryRowContext, ExecContext, PrepareContext, BeginTx]
    target_arg: 0

  # -- standard streams ------------------------------------------------------- #
  - kind: STDIO
    direction: OUT
    salience: normal
    exact: [fmt.Print, fmt.Println, fmt.Printf, os.Stdout.Write, os.Stdout.WriteString,
            os.Stderr.Write, os.Stderr.WriteString]
    target_arg: 0
  - kind: STDIO
    direction: IN
    salience: high
    exact: [fmt.Scan, fmt.Scanln, fmt.Scanf, os.Stdin.Read]
    target_arg: 0
  - kind: STDIO
    direction: OUT
    salience: low
    prefix: [log., slog.]
    target_arg: 0

  # -- cryptography ----------------------------------------------------------- #
  # Not I/O, but load-bearing: worth seeing on a flow that handles trust.
  - kind: CRYPTO
    direction: BOTH
    salience: normal
    prefix: [aes., cipher., hmac., rsa., ecdsa., ed25519., bcrypt., argon2., x509.]
    exact: [sha256.New, sha256.Sum256, sha512.New, sha512.Sum512, sha1.New, sha1.Sum,
            md5.New, md5.Sum, subtle.ConstantTimeCompare]
    target_arg: 0

# Remote calls, in the detail an infrastructure engineer needs. **Every Go client is
# `async: false`**: a Go call blocks its goroutine and returns its result, and concurrency
# is a `go` statement around it rather than a property of the library.
#
# **Named calls, never a package prefix** (rule 1). `http.` would make `http.StatusText`
# and `http.NewServeMux` remote calls and `net.` would make `net.ParseIP` one; a key with a
# dot is a prefix, so each is the call that actually goes somewhere.
# **A boundary a signature names, before any body touches it** (schema 20). Read only
# where the routine's body shows nothing of that kind, and recorded as *declared*, never
# as a touch (`declared_boundaries`). `net.Conn` and `net.Listener` are the network's and
# a Unix socket's alike, so they are NETWORK and say they may not be.
signatures:
  - {type: "*net.UnixListener", kind: LOCAL_IPC, direction: IN}
  - {type: "*net.UnixConn",     kind: LOCAL_IPC, direction: BOTH}
  - {type: "net.Listener",      kind: NETWORK,   direction: IN,   note: "may be a Unix-domain socket"}
  - {type: "net.Conn",          kind: NETWORK,   direction: BOTH, note: "may be a Unix-domain socket"}

# **The packages a method's receiver is typed against** (`plugins/go/typed.go`), keyed by
# import path: Go source with no bodies, declaring what the typed rules above name and the
# package functions a value may be taken of. **Declared here and never read from GOROOT**,
# because a file's facts are cached under the reader's stamp and the stamp does not carry
# the toolchain: read against whatever Go is installed, the facts would change with an
# upgrade and nothing would notice (rule 81). What is declared is Go 1's promise, so it does
# not drift. A name missing here is simply undefined to the checker: its calls keep the
# spelling the file writes and its values are not recorded.
typed_packages:
  os: |
    package os

    type File struct{}
    type FileInfo interface{}
    type FileMode uint32
    type DirEntry interface{}
    type Root struct{}

    func Open(name string) (*File, error)
    func Create(name string) (*File, error)
    func OpenFile(name string, flag int, perm FileMode) (*File, error)
    func OpenRoot(name string) (*Root, error)
    func OpenInRoot(dir, name string) (*File, error)
    func ReadFile(name string) ([]byte, error)
    func WriteFile(name string, data []byte, perm FileMode) error
    func ReadDir(name string) ([]DirEntry, error)
    func Stat(name string) (FileInfo, error)
    func Lstat(name string) (FileInfo, error)
    func Readlink(name string) (string, error)
    func DirFS(dir string) any
    func Remove(name string) error
    func RemoveAll(path string) error
    func Mkdir(name string, perm FileMode) error
    func MkdirAll(path string, perm FileMode) error
    func MkdirTemp(dir, pattern string) (string, error)
    func CreateTemp(dir, pattern string) (*File, error)
    func Rename(oldpath, newpath string) error
    func Chmod(name string, mode FileMode) error
    func Chown(name string, uid, gid int) error
    func Lchown(name string, uid, gid int) error
    func Chtimes(name string, atime, mtime any) error
    func Truncate(name string, size int64) error
    func Symlink(oldname, newname string) error
    func Link(oldname, newname string) error

    func (r *Root) Name() string
    func (r *Root) Close() error
    func (r *Root) Open(name string) (*File, error)
    func (r *Root) Create(name string) (*File, error)
    func (r *Root) OpenFile(name string, flag int, perm FileMode) (*File, error)
    func (r *Root) OpenRoot(name string) (*Root, error)
    func (r *Root) ReadFile(name string) ([]byte, error)
    func (r *Root) WriteFile(name string, data []byte, perm FileMode) error
    func (r *Root) Stat(name string) (FileInfo, error)
    func (r *Root) Lstat(name string) (FileInfo, error)
    func (r *Root) Readlink(name string) (string, error)
    func (r *Root) Mkdir(name string, perm FileMode) error
    func (r *Root) MkdirAll(name string, perm FileMode) error
    func (r *Root) Remove(name string) error
    func (r *Root) RemoveAll(name string) error
    func (r *Root) Rename(oldname, newname string) error
    func (r *Root) Link(oldname, newname string) error
    func (r *Root) Symlink(oldname, newname string) error
    func (r *Root) Chmod(name string, mode FileMode) error
    func (r *Root) Chown(name string, uid, gid int) error
    func (r *Root) Lchown(name string, uid, gid int) error
    func (r *Root) Chtimes(name string, atime, mtime any) error
    func (r *Root) FS() any
  os/exec: |
    package exec

    type Cmd struct{}

    func Command(name string, arg ...string) *Cmd
    func CommandContext(ctx any, name string, arg ...string) *Cmd
  net: |
    package net

    type Conn interface{}
    type Listener interface{}
    type PacketConn interface{}
    type Dialer struct{}
    type ListenConfig struct{}

    func (d *Dialer) Dial(network, address string) (Conn, error)
    func (d *Dialer) DialContext(ctx any, network, address string) (Conn, error)
    func (lc *ListenConfig) Listen(ctx any, network, address string) (Listener, error)
    func (lc *ListenConfig) ListenPacket(ctx any, network, address string) (PacketConn, error)

network:
  libraries:
    "http.Get":             {protocol: HTTP, async: false}
    "http.Post":            {protocol: HTTP, async: false}
    "http.Head":            {protocol: HTTP, async: false}
    "http.NewRequest":      {protocol: HTTP, async: false}
    "grpc.Dial":            {protocol: gRPC, async: false}
    "grpc.NewClient":       {protocol: gRPC, async: false}
    "net.Dial":             {protocol: TCP,  async: false}
    "net.DialTimeout":      {protocol: TCP,  async: false}
    "tls.Dial":             {protocol: TCP,  async: false}
    "websocket.Dial":       {protocol: WebSocket, async: false}
  verbs: [Get, Post, Head, PostForm]
  kwargs: []
  # **A call that cannot be made without a timeout, and the argument that carries it** --
  # `rust.yaml`'s key, for the same reason: Go has no keyword arguments, so the name says
  # it and the position says where. `net.DialTimeout` was a NO_TIMEOUT on the one call
  # named for its timeout. One set on the object -- `http.Client{Timeout: ...}`,
  # `net.Dialer{Timeout: ...}` -- is not read: that is NO_TIMEOUT's own blind spot.
  timed:
    "net.DialTimeout": 2

artefacts:
  extensions:
    DATABASE: [db, sqlite, sqlite3, bolt, badger]
    CONFIG: [json, yaml, yml, toml, ini, cfg, conf, env]

# Only in `package main`, and never a method: the reader enforces both, because a function
# called `main` anywhere else is an ordinary function.
entry_names: [main]

# **No `unawaited_async` and no `redefinition`, and both are decisions.** Go has no
# async/await: `go f()` starts a goroutine, which is a different act with no dropped
# result to report. And the compiler already refuses a real duplicate, while a function
# defined once per build target (`run_linux.go`, `run_windows.go`) is ordinary Go, so a
# redefinition finding here would report the language working as a defect (rule 98).
# Absent means the detector does not fire, which is the declared answer rather than a
# default (rule 49).

# Go's predeclared functions. A bare call to one of these is never a routine of yours
# (rule 3), even where a package declares a function of the same name, because the
# checker has already said which one was meant.
builtins: [
  "append", "cap", "clear", "close", "complex", "copy", "delete", "imag", "len", "make",
  "max", "min", "new", "panic", "print", "println", "real", "recover",
]

# ---------------------------------------------------------------------------- #
# Ways in beyond `main`. **Two idioms, and neither is a decorator or a file path**, so
# neither fits a key another reader already has: Go registers a handler by calling
# something, and cobra declares a command with a composite literal. Each is data here and
# never a branch in the reader, so a router this file does not name is an edit to this
# file (`LANGUAGES.md`: prefer a rule to a branch).
#
# A handler written inline is a routine named by the word that registered it (`HandleFunc`,
# `RunE`), with an ordinal where one routine registers several; that is the word written
# at that line, and never a name invented for it (rule 30). A handler named by an
# identifier is linked to the function of that name in the same file; one named any other
# way keeps its expression in `target_expr` and is still a way in.

# A call whose last segment is one of `method`, whose `route_arg` is a string literal
# shaped like a route (`/x`, or a verb and a path, `GET /x`), and whose `handler_arg` is
# the handler (-1 is the last argument). The route test is what makes a bare method name
# safe here (rule 5): `cache.Get("k", v)` is not a route, because "k" is not one.
registrations:
  - kind: HTTP_ROUTE
    method: [HandleFunc, Handle, Get, Post, Put, Patch, Delete, Head, Options, Any,
             GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, Group, Route, Mount]
    route_arg: 0
    handler_arg: -1
    evidence: "an HTTP handler, registered by a call"

# A composite literal of one of `type`, named by the first word of its `name_field`, whose
# work is the first of `handler_fields` it sets. **One that sets none is a group**, a
# namespace with subcommands under it, and is not a way in: recorded as one, each read as a
# way in that *leads nowhere* (four SUSPECT on rain, every one this reader's). The tree a
# group makes with `AddCommand` is not drawn yet, and that is the residue.
commands:
  - kind: CLI
    type: [cobra.Command]
    name_field: Use
    handler_fields: [RunE, Run]
    evidence: "a cobra command"

# **What `private` means here, for the naming lane's LEAKAGE claim** (`RuleSet.private_means`):
# an unexported name is visible to every file in its package directory.
private_means: package

# Go has no macros.
macro_expansion: none
