# What a Java program touches outside itself, and the judgements only Java can make.
#
# Matched against the dotted form of a call (`ingest/dotted.py`), which for Java is the
# expression as written: `java.nio.file.Files.readString(p)` is
# `java.nio.file.Files.readString`, and after `import java.nio.file.Files;` it is
# `Files.readString`. **Both spellings are declared where both are written.** The reader
# never expands an import (clause 4, and rule 5), so a rule naming only the long one would
# miss most of every corpus with no symptom. `new Socket(h, p)` is the construction
# `Socket` (clause 7), and a type argument is not part of a name: `List.<T>of()` is
# `List.of` (clause 6).
#
# `kotlin.yaml` holds the JVM's own classes too, and was the starting point here. Nothing
# was copied without being read, because a Kotlin rule is matched against Kotlin's
# spellings (`readText` is an extension Java does not have).

version: 1

boundaries:
  - kind: ENV
    direction: IN
    exact: [System.getenv, System.getProperty, java.lang.System.getenv,
            java.lang.System.getProperty]
    target_arg: 0

  - kind: FILE
    direction: IN
    exact: [FileInputStream, FileReader, RandomAccessFile, java.io.FileInputStream,
            java.io.FileReader, Files.readString, Files.readAllBytes, Files.readAllLines,
            Files.lines, Files.newBufferedReader, Files.newInputStream, Files.list,
            Files.walk, Files.exists, Files.isDirectory, Files.isRegularFile, Files.size,
            java.nio.file.Files.readString, java.nio.file.Files.readAllBytes,
            java.nio.file.Files.readAllLines, java.nio.file.Files.lines,
            java.nio.file.Files.newBufferedReader, java.nio.file.Files.newInputStream]
    target_arg: 0
  - kind: FILE
    direction: OUT
    exact: [FileOutputStream, FileWriter, PrintWriter, java.io.FileOutputStream,
            java.io.FileWriter, Files.writeString, Files.write, Files.newBufferedWriter,
            Files.newOutputStream, Files.createDirectories, Files.createDirectory,
            Files.createFile, Files.createTempFile, Files.createTempDirectory, Files.delete,
            Files.deleteIfExists, Files.copy, Files.move,
            java.nio.file.Files.writeString, java.nio.file.Files.write,
            java.nio.file.Files.newBufferedWriter, java.nio.file.Files.newOutputStream,
            java.nio.file.Files.createDirectories, java.nio.file.Files.delete,
            java.nio.file.Files.copy, java.nio.file.Files.move]
    target_arg: 0

  - kind: PROCESS
    direction: BOTH
    exact: [ProcessBuilder, java.lang.ProcessBuilder, Runtime.getRuntime.exec]
    target_arg: 0
  # **Leaving the process is a touch, and a quiet one.** `os.Exit` was 714 of beads' 5,891
  # touches until it was given low salience; `System.exit` is the same act.
  - kind: PROCESS
    direction: OUT
    salience: low
    exact: [System.exit, Runtime.getRuntime.halt]
    target_arg: 0

  # -- local IPC -------------------------------------------------------------- #
  # **A Unix-domain socket is another process on this machine, never the network**
  # (`LANGUAGES.md`, *LOCAL_IPC*). Java 16 names one two ways: an address built from a path,
  # which is the act and carries the path, and a channel opened for the `UNIX` family, which
  # is decided on its argument. A channel opened from a variable is NETWORK and says
  # nothing: every TCP `open(new InetSocketAddress(...))` would otherwise carry a blind
  # spot (rule 43), and a Unix one built from an address has that address's own row.
  - kind: LOCAL_IPC
    direction: BOTH
    salience: high
    exact: [UnixDomainSocketAddress.of, java.net.UnixDomainSocketAddress.of]
    target_arg: 0
  - kind: LOCAL_IPC
    direction: OUT
    salience: high
    exact: [SocketChannel.open, java.nio.channels.SocketChannel.open]
    when_arg: {index: 0, in: [StandardProtocolFamily.UNIX, java.net.StandardProtocolFamily.UNIX, UNIX]}
  - kind: LOCAL_IPC
    direction: IN
    salience: high
    exact: [ServerSocketChannel.open, java.nio.channels.ServerSocketChannel.open]
    when_arg: {index: 0, in: [StandardProtocolFamily.UNIX, java.net.StandardProtocolFamily.UNIX, UNIX]}
  - kind: NETWORK
    direction: OUT
    salience: high
    exact: [SocketChannel.open, java.nio.channels.SocketChannel.open, DatagramChannel.open,
            java.nio.channels.DatagramChannel.open, AsynchronousSocketChannel.open,
            java.nio.channels.AsynchronousSocketChannel.open]
    target_arg: 0
  - kind: NETWORK
    direction: IN
    salience: high
    exact: [ServerSocketChannel.open, java.nio.channels.ServerSocketChannel.open,
            AsynchronousServerSocketChannel.open,
            java.nio.channels.AsynchronousServerSocketChannel.open]

  - kind: NETWORK
    direction: BOTH
    exact: [Socket, ServerSocket, DatagramSocket, java.net.Socket, java.net.ServerSocket,
            URL.openConnection, URL.openStream, HttpClient.newHttpClient,
            HttpClient.newBuilder, java.net.http.HttpClient.newHttpClient,
            java.net.http.HttpClient.newBuilder, OkHttpClient, okhttp3.OkHttpClient]
    target_arg: 0

  # JDBC, which is how a Java server keeps anything. **A statement is prepared on a
  # connection, and that is the act**: `prepareStatement`, `prepareCall` and
  # `createStatement` are `java.sql.Connection`'s own names. `executeQuery` and
  # `executeUpdate` are not matched, because a program's own query builder is called that
  # too: traccar's `builder.executeUpdate()` is its `QueryBuilder`, and a boundary there
  # would cut every flow into the class that does the touching (rule 2, rule 5).
  - kind: DATABASE
    direction: BOTH
    exact: [DriverManager.getConnection, java.sql.DriverManager.getConnection]
    method: [prepareStatement, prepareCall, createStatement]
    target_arg: 0

  # **Netty**, which is how a Java network server is written. A bootstrap is where it
  # listens or connects, and `writeAndFlush` is the write: Netty's own name, used 207 times
  # in traccar and by nothing else. `write` and `connect` alone are not matched (rule 5).
  - kind: NETWORK
    direction: BOTH
    exact: [ServerBootstrap, Bootstrap, io.netty.bootstrap.ServerBootstrap,
            io.netty.bootstrap.Bootstrap]
    target_arg: 0
  - kind: NETWORK
    direction: OUT
    method: [writeAndFlush]
    target_arg: 0

  # **JAX-RS's client, by the type javac gives the receiver** (BACKLOG 46).
  # `client.target(url).request().get()` is 18 of traccar's network calls, and `get`,
  # `target` and `request` are far too common to match as written (rule 5). These entries are
  # a declaring type and its method, which no call is ever spelled as: only the edge pass
  # matches them (`Rules.typed`), against the method javac resolved, and only with the JAX-RS
  # jar on this machine. Without it the call is `untyped` and stays a stated residue.
  - kind: NETWORK
    direction: OUT
    exact: [jakarta.ws.rs.client.SyncInvoker.get, jakarta.ws.rs.client.SyncInvoker.post,
            jakarta.ws.rs.client.SyncInvoker.put, jakarta.ws.rs.client.SyncInvoker.delete,
            jakarta.ws.rs.client.SyncInvoker.head, jakarta.ws.rs.client.SyncInvoker.options,
            jakarta.ws.rs.client.SyncInvoker.trace, jakarta.ws.rs.client.SyncInvoker.method,
            jakarta.ws.rs.client.AsyncInvoker.get, jakarta.ws.rs.client.AsyncInvoker.post,
            jakarta.ws.rs.client.AsyncInvoker.put, jakarta.ws.rs.client.AsyncInvoker.delete,
            jakarta.ws.rs.client.AsyncInvoker.head, jakarta.ws.rs.client.AsyncInvoker.options,
            jakarta.ws.rs.client.AsyncInvoker.trace, jakarta.ws.rs.client.AsyncInvoker.method,
            jakarta.ws.rs.client.Invocation.invoke, jakarta.ws.rs.client.Invocation.submit,
            javax.ws.rs.client.SyncInvoker.get, javax.ws.rs.client.SyncInvoker.post,
            javax.ws.rs.client.SyncInvoker.put, javax.ws.rs.client.SyncInvoker.delete,
            javax.ws.rs.client.SyncInvoker.head, javax.ws.rs.client.SyncInvoker.options,
            javax.ws.rs.client.SyncInvoker.trace, javax.ws.rs.client.SyncInvoker.method,
            javax.ws.rs.client.AsyncInvoker.get, javax.ws.rs.client.AsyncInvoker.post,
            javax.ws.rs.client.AsyncInvoker.put, javax.ws.rs.client.AsyncInvoker.delete,
            javax.ws.rs.client.AsyncInvoker.head, javax.ws.rs.client.AsyncInvoker.options,
            javax.ws.rs.client.AsyncInvoker.trace, javax.ws.rs.client.AsyncInvoker.method,
            javax.ws.rs.client.Invocation.invoke, javax.ws.rs.client.Invocation.submit]

  - kind: STDIO
    direction: OUT
    exact: [System.out.println, System.out.print, System.out.printf, System.out.format,
            System.out.write, System.err.println, System.err.print, System.err.printf,
            System.err.format, System.err.write]
    target_arg: 0
  - kind: STDIO
    direction: IN
    salience: high
    exact: [System.in.read, System.console]
    target_arg: 0

  - kind: CRYPTO
    direction: BOTH
    exact: [MessageDigest.getInstance, Cipher.getInstance, Mac.getInstance,
            KeyGenerator.getInstance, KeyPairGenerator.getInstance, Signature.getInstance,
            SecretKeyFactory.getInstance, SecureRandom, SecureRandom.getInstanceStrong,
            java.security.MessageDigest.getInstance, javax.crypto.Cipher.getInstance,
            javax.crypto.Mac.getInstance]
    target_arg: 0

network:
  libraries:
    "HttpClient.newHttpClient":                 {protocol: HTTP, async: false}
    "HttpClient.newBuilder":                    {protocol: HTTP, async: false}
    "java.net.http.HttpClient.newHttpClient":   {protocol: HTTP, async: false}
    "java.net.http.HttpClient.newBuilder":      {protocol: HTTP, async: false}
    "URL.openConnection":                       {protocol: HTTP, async: false}
    "URL.openStream":                           {protocol: HTTP, async: false}
    "OkHttpClient":                             {protocol: HTTP, async: false}
    "okhttp3.OkHttpClient":                     {protocol: HTTP, async: false}
    "Socket":                                   {protocol: TCP,  async: false}
    "java.net.Socket":                          {protocol: TCP,  async: false}
    "ServerSocket":                             {protocol: TCP,  async: false}
    "java.net.ServerSocket":                    {protocol: TCP,  async: false}
    "DatagramSocket":                           {protocol: UDP,  async: false}
  verbs: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
  kwargs: []

artefacts:
  extensions:
    DATABASE: [db, sqlite, sqlite3, h2, mv.db]
    CONFIG: [json, xml, yaml, yml, properties, toml, conf]
    ARCHIVE: [zip, jar, war, ear]

# **A dropped future runs.** That is Kotlin's answer and JavaScript's, not Python's.
# `CompletableFuture.supplyAsync(…)` and `executor.submit(…)` start the work when they are
# called; never joining the result loses the ordering and, unhandled, the failure, but the
# work still happens. So the cost is SUSPECT rather than BROKEN. Java has no `async`
# keyword, so only a call a rule marks `async: true` can be read as dropped, and
# `dunneflow check` on a real tree is what says whether that is right (rule 98).
unawaited_async: runs

# **Java overloads**, like C++ and Kotlin and unlike Python. A second method with a
# different parameter list is a different method, so a name collision finding would report
# the language working as a defect (rule 98).
redefinition: overloads

entrypoints:
  # **A Java server declares its ways in by annotation**, and the framework calls them:
  # nothing in the program does, so without a rule each reads as dead code in a worklist.
  # The reader names a route by its annotation and path as written, with the class's own
  # `@RequestMapping` or `@Path` in front (`GetMapping /owners/{ownerId}`).
  - kind: HTTP_ROUTE
    decorator_method: [GetMapping, PostMapping, PutMapping, DeleteMapping, PatchMapping,
                       RequestMapping, GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS]
    evidence: "an HTTP route declared by annotation (Spring MVC or JAX-RS)"
  - kind: SCHEDULED
    decorator_method: [Scheduled]
    evidence: "run on a schedule by the framework"
  - kind: QUEUE_CONSUMER
    decorator_method: [KafkaListener, JmsListener, RabbitListener, SqsListener]
    evidence: "called by the framework for each message"
  # Spring's and Guice's and Dagger's: a method the container calls to build or announce
  # something. traccar's `MainModule` is 24 `@Provides` methods that nothing in the program
  # calls, and each read as dead code without this rule.
  - kind: LIBRARY
    decorator_method: [EventListener, PostConstruct, Bean, Provides, Binds]
    evidence: "called by the framework, by annotation"
  # A test is a way in too: nothing in the program calls it, and it is the only caller many
  # routines have. Kept separate so a reader can tell it from a way in a user reaches.
  - kind: CLI
    decorator_method: [Test, ParameterizedTest, BeforeEach, AfterEach, BeforeAll, AfterAll,
                       Before, After, BeforeClass, AfterClass]
    evidence: "run by the test framework"

# **What a class is by what it extends** (BACKLOG 45). Read by the edge pass and by nothing
# else: whether a class extends a framework's type is often said two classes up, in another
# file, and a file's facts may not depend on one (rule 95).
#
# `boundary`: a call on a receiver of such a type, where the tree holds no body to run, is
# that touch. `entrypoint`: a method named in `methods`, in such a class, that overrides the
# framework's and not one of the program's own, is a way in.
#
# **Every type a program writes after `extends` is listed, not only the root.** With the
# framework's jars on this machine javac follows `JpaRepository` up to `Repository` itself.
# Without them, which is the ordinary case, the only name there is to read is the one the
# file wrote.
extends:
  # Spring Data writes the repository at run time from the interface, so no class in the
  # tree implements it and petclinic's every `owners.save(…)` read as a call that stopped
  # at an interface: 0 touches, in a program that is a database front end.
  - types: [org.springframework.data.repository.Repository,
            org.springframework.data.repository.CrudRepository,
            org.springframework.data.repository.ListCrudRepository,
            org.springframework.data.repository.PagingAndSortingRepository,
            org.springframework.data.repository.ListPagingAndSortingRepository,
            org.springframework.data.repository.reactive.ReactiveCrudRepository,
            org.springframework.data.repository.reactive.ReactiveSortingRepository,
            org.springframework.data.jpa.repository.JpaRepository,
            org.springframework.data.mongodb.repository.MongoRepository,
            org.springframework.data.mongodb.repository.ReactiveMongoRepository,
            org.springframework.data.r2dbc.repository.R2dbcRepository]
    boundary: DATABASE
    direction: BOTH
    evidence: "a Spring Data repository, which the framework implements at run time"
  - types: [jakarta.servlet.http.HttpServlet, javax.servlet.http.HttpServlet]
    entrypoint: HTTP_ROUTE
    methods: [doGet, doPost, doPut, doDelete, doHead, doOptions, doPatch, service]
    evidence: "called by the servlet container for a request"
  - types: [jakarta.servlet.Filter, javax.servlet.Filter,
            jakarta.servlet.http.HttpFilter, javax.servlet.http.HttpFilter]
    entrypoint: LIBRARY
    methods: [doFilter]
    evidence: "called by the servlet container for every request it filters"
  # Netty calls a handler's methods as bytes arrive and leave. The method must override
  # Netty's own: traccar's frame decoders each write a `decode` that overrides traccar's
  # abstract one, and only the class that fills Netty's slot is the way in.
  - types: [io.netty.channel.ChannelHandler, io.netty.channel.ChannelInboundHandler,
            io.netty.channel.ChannelOutboundHandler,
            io.netty.channel.ChannelInboundHandlerAdapter,
            io.netty.channel.ChannelOutboundHandlerAdapter,
            io.netty.channel.ChannelDuplexHandler,
            io.netty.channel.SimpleChannelInboundHandler,
            io.netty.channel.ChannelInitializer,
            io.netty.handler.codec.ByteToMessageDecoder,
            io.netty.handler.codec.ByteToMessageCodec,
            io.netty.handler.codec.MessageToByteEncoder,
            io.netty.handler.codec.MessageToMessageDecoder,
            io.netty.handler.codec.MessageToMessageEncoder,
            io.netty.handler.codec.MessageToMessageCodec,
            io.netty.handler.codec.LineBasedFrameDecoder,
            io.netty.handler.codec.DelimiterBasedFrameDecoder,
            io.netty.handler.codec.LengthFieldBasedFrameDecoder,
            io.netty.handler.codec.FixedLengthFrameDecoder]
    entrypoint: LIBRARY
    methods: [channelRead, channelRead0, channelActive, channelInactive, channelRegistered,
              channelUnregistered, channelReadComplete, channelWritabilityChanged,
              userEventTriggered, exceptionCaught, handlerAdded, handlerRemoved, initChannel,
              decode, decodeLast, encode, write, flush, read, connect, disconnect, close, bind]
    evidence: "called by Netty's pipeline"

# `public static void main(String[] args)`, and only that shape: the reader checks that it
# is static and takes one `String[]` or `String...`. Java 21's instance `main` is a preview
# feature and is not read as a way in.
entry_names: [main]

# **None.** Java has no free functions, so no bare call can be a library's rather than
# yours (rule 3). An empty list is the declared answer, not a default.
builtins: []

# **What `private` means here, for the naming lane's LEAKAGE claim** (`RuleSet.private_means`):
# `protected` and package-private are recorded as private beside `private` itself, and
# both are visible beyond the file, so a call from another file is often correct code.
private_means: surface
private_reason: "`protected` and package-private are recorded as private beside `private` itself, and both are visible beyond the file"

# **Why a call has no edge, in Java's terms** (`detectors.frontier_words`). `untyped` is a
# receiver javac could not type -- a missing class, generated code, a dependency that is not
# on this machine -- or an overload it chose with an argument it could not type.
frontier_words:
  untyped: "javac could not type it: a class or dependency it needs is not here"

# Java has no macros.
macro_expansion: none
