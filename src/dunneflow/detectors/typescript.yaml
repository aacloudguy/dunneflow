# Boundary rules for TypeScript.
#
# This file is the extension point, and it is read **in this process** and handed to the
# reader over the wire (`detectors.rules_document`, `ingest/worker.py:open`). A plugin
# with its own baked-in copy would stop moving the moment somebody edited this file, and
# this file is in **TypeScript's** extraction stamp (`detectors.lang_extraction_inputs`)
# precisely so that an edit re-reads every TypeScript file — and costs Python nothing.
# There is one file.
#
# *That sentence said "the core extraction key ... re-reads every language" until chunk
# 11, in three files at once. It was true when it was written and chunk 5 made it false:
# `_SHARED_RULES` is `annotations.yaml` alone. It was right about why the file travels
# and wrong about what editing it discards, which is the half a reader acts on.*
#
# Rules are matched against the **dotted form** of a call expression, exactly as Python's
# are — the contract is `ingest/dotted.py` and it is the same contract. So
# `fs.promises.readFile(...)` matches as `fs.promises.readFile`, `a?.b!.c()` as `a.b.c`,
# `new WebSocket(u)` as `WebSocket`, and `Path(p).read_text()`'s TypeScript cousin
# `createClient(x).query()` as `createClient.query`.
#
# Match forms, unchanged from python.yaml because they are the contract and not a dialect:
#   exact     -- the full dotted name equals one of these
#   prefix    -- the dotted name starts with one of these (include the trailing dot)
#   method    -- the last segment equals one of these, whatever the receiver
#   subscript -- an index expression on this dotted name (process.env["X"])
#   contains  -- the dotted name contains one of these
#
# **The import prefix is what a TypeScript rule mostly matches, and that is rule 4.** A
# reader never resolves or expands an alias, so `import { readFile } from "node:fs"` then
# `readFile(p)` is spelled `readFile` and `import * as fs from "node:fs"` then
# `fs.readFile(p)` is spelled `fs.readFile`. Both spellings are declared where both are
# written; a rule that named only one would miss half of every corpus with no symptom.
#
# **There is no BROWSER kind and that was settled by measurement, not taste** —
# `PLAN-v2.md`'s open question 1. `fetch` and WebSocket are the network under another
# name; `localStorage`, `sessionStorage` and IndexedDB are persistent named storage shared
# across an origin, which is what DATABASE means, and their `target` carries the
# `localStorage:` prefix so no reader is misled. The DOM is the program's own rendered
# output rather than its environment, and is deliberately **not reported at all** — 81
# `.svelte` files' worth of `querySelector` would be thousands of rows drowning the panel
# they were added to (rule 1). The residue is stated in words rather than in a kind.

version: 1

boundaries:
  # -- environment ------------------------------------------------------------ #
  # `process.env.X` is a property read and not a call, so it arrives here as a subscript
  # in the same way `os.environ["X"]` does. The reader spells a dotted property access on
  # `process.env` as a subscript on `process.env`, which is what makes one rule serve
  # `process.env.PORT` and `process.env["PORT"]` alike.
  - kind: ENV
    direction: IN
    salience: high
    subscript: [process.env, import.meta.env, Deno.env]
    exact: [Deno.env.get, process.env.get]
    target_arg: 0
  - kind: ENV
    direction: OUT
    salience: high
    exact: [Deno.env.set]
    target_arg: 0

  # -- files ------------------------------------------------------------------ #
  # Node spells its filesystem four ways and a corpus uses all four: the callback API,
  # the promise API, the sync API, and the `node:` prefixed module specifiers that are now
  # the recommended form. The prefix list carries the namespace-import spellings and the
  # method list carries the named-import ones.
  - kind: FILE
    direction: OUT
    salience: high
    prefix: [fs.promises.write, fsp.write, fs.write, fs.appendFile, fs.mkdir, fs.rm,
             fs.unlink, fs.rename, fs.copyFile, fs.chmod, fs.truncate]
    method: [writeFile, writeFileSync, appendFile, appendFileSync, mkdir, mkdirSync,
             rm, rmSync, rmdir, rmdirSync, unlink, unlinkSync, rename, renameSync,
             copyFile, copyFileSync, createWriteStream, truncate, truncateSync,
             writeTextFile, writeFile_, remove]
    exact: [writeFile, writeFileSync, appendFile, appendFileSync, mkdir, mkdirSync,
            rm, rmSync, unlink, unlinkSync, rename, renameSync, copyFile, copyFileSync,
            createWriteStream]
    target_arg: 0
  - kind: FILE
    direction: IN
    salience: normal
    prefix: [fs.promises.read, fsp.read, fs.read, fs.createReadStream, fs.opendir]
    method: [readFile, readFileSync, readdir, readdirSync, createReadStream, opendir,
             opendirSync, readTextFile, readDir]
    exact: [readFile, readFileSync, readdir, readdirSync, createReadStream, open]
    target_arg: 0
  - kind: FILE
    direction: IN
    salience: low
    prefix: [fs.stat, fs.lstat, fs.exists, fs.access, fs.promises.stat,
             fs.promises.access]
    method: [stat, statSync, lstat, lstatSync, existsSync, access, accessSync]
    exact: [existsSync, statSync, lstatSync, access, accessSync]
    target_arg: 0

  # -- processes -------------------------------------------------------------- #
  # Tauri's `invoke` is here rather than under NETWORK and the reason is stated: it is an
  # IPC call into a Rust process in the same application, which is what PROCESS means. It
  # crosses no network and it is not a request anybody could serve from elsewhere.
  - kind: PROCESS
    direction: BOTH
    salience: high
    prefix: [child_process., cp., execa.]
    method: [spawn, spawnSync, exec, execSync, execFile, execFileSync, fork]
    exact: [spawn, spawnSync, exec, execSync, execFile, execFileSync, fork, execa,
            invoke, Command.create]
    target_arg: 0
  - kind: PROCESS
    direction: OUT
    salience: normal
    exact: [process.exit, process.abort, process.kill, Deno.exit]
    target_arg: 0

  # -- network ---------------------------------------------------------------- #
  # `fetch` is the whole modern surface and it is a bare global, so `exact` rather than a
  # prefix. `new WebSocket(u)` folds to `WebSocket` by clause 7 of the dotted contract and
  # keeps `is_construction` beside it, so the two spellings stay two facts.
  - kind: NETWORK
    direction: BOTH
    salience: high
    exact: [fetch, WebSocket, EventSource, XMLHttpRequest, globalThis.fetch,
            window.fetch, node-fetch, got, superagent]
    prefix: [axios., ky., got., superagent., undici., http.request, https.request,
             http.get, https.get, socket.emit, io.]
    method: [subscribe, publish]
    target_arg: 0

  # -- large-model APIs ------------------------------------------------------- #
  - kind: LLM_API
    direction: BOTH
    salience: high
    prefix: [anthropic., openai., ai., generateText, streamText, generateObject,
             streamObject, google.generativeai.]
    exact: [generateText, streamText, generateObject, streamObject, embed, embedMany]
    contains: [.messages.create, .chat.completions.create, .completions.create]
    target_arg: 0

  # -- cloud SDKs ------------------------------------------------------------- #
  # The v3 AWS SDKs are all `client.send(new SomeCommand(...))`, so the receiver varies
  # and the method does not. `.send` alone would be far too broad, so the `Command`
  # construction is what carries the evidence and `contains` catches the module prefix.
  - kind: CLOUD_SDK
    direction: BOTH
    salience: high
    prefix: [DynamoDBClient., DynamoDBDocumentClient., S3Client., SNSClient.,
             SQSClient., LambdaClient., SecretsManagerClient., CloudWatchClient.,
             firebase., admin.firestore., supabase.]
    contains: [DynamoDBDocument, CloudFormation]
    target_arg: 0

  # -- databases -------------------------------------------------------------- #
  # `localStorage` and IndexedDB live here, and the reason is in this file's header: they
  # are persistent named storage shared across an origin, which is what DATABASE means.
  # The target carries the store's own name so nobody reads one as a table.
  - kind: DATABASE
    direction: BOTH
    salience: high
    prefix: [prisma., db., knex., sql., pool., client.query, conn., drizzle.,
             mongoose., collection., supabase.from]
    method: [findUnique, findFirst, findMany, createMany, updateMany, deleteMany,
             upsert, aggregate, groupBy, executeRaw, queryRaw, transaction]
    exact: [localStorage.getItem, localStorage.setItem, localStorage.removeItem,
            localStorage.clear, sessionStorage.getItem, sessionStorage.setItem,
            sessionStorage.removeItem, sessionStorage.clear, indexedDB.open,
            indexedDB.deleteDatabase, caches.open]
    subscript: [localStorage, sessionStorage]
    target_arg: 0

  # -- queues and messaging --------------------------------------------------- #
  - kind: QUEUE
    direction: BOTH
    salience: normal
    prefix: [amqp., kafka., producer., consumer., bullmq., queue.add, redis.publish,
             redis.subscribe]
    exact: [postMessage, self.postMessage, worker.postMessage]
    target_arg: 0

  # -- standard input and output ---------------------------------------------- #
  # `console.*` is low salience for python.yaml's reason: real, numerous, and recorded so
  # it can be filtered rather than dropped.
  - kind: STDIO
    direction: OUT
    salience: low
    prefix: [console., process.stdout.write, process.stderr.write, Deno.stdout.write]
    target_arg: 0
  - kind: STDIO
    direction: IN
    salience: normal
    prefix: [process.stdin.]
    exact: [prompt, readline.question]
    target_arg: 0

  # -- cryptography ----------------------------------------------------------- #
  - kind: CRYPTO
    direction: BOTH
    salience: high
    prefix: [crypto., bcrypt., argon2., jose., jwt., nacl., subtle.]
    exact: [hash, compare, hashSync, compareSync, randomUUID, randomBytes,
            createHash, createHmac, sign, verify]
    target_arg: 0

# What counts as a network call in its own right, for the `net_calls` table. The
# prefixes are matched longest-first by `load_rules`, so `axios.` and a bare `fetch`
# can both be declared without one shadowing the other.
# -- the boundary a name cannot reach ------------------------------------------ #
#
# **Matched against the package the checker resolved a call into, not against its
# spelling.** The `boundaries` rules above match the dotted form of an expression, which is
# a guess about what somebody called a local variable; these match what the compiler
# already worked out to type the call. Three of DunneCorp's four most interesting
# boundaries are written in ways no spelling rule can find:
#
#     const resend = new Resend(apiKey);  await resend.emails.send({…})
#     await getStripe().checkout.sessions.create({…})
#     await doc.send(new UpdateCommand({…}))
#
# **A package rule outranks a name rule**, and a call still yields exactly one boundary
# (rule 40). Where the checker has spoken its answer is the fact; the spellings above are
# the fallback for everything it could not resolve. `plugins/typescript/src/pkg.ts` is the
# one place it is asked.
#
# **Every entry below was measured**, and the count is the corpus it was measured on. That
# matters most for the ones that are *not* here: `zod` is 169 calls in DunneCorp and is
# validation rather than a boundary, `prosemirror-*` is 143 in DunneNote and is a document
# model in memory, `svelte` is 256, and `@types/node` is 159 — which must stay out, or
# every file, process and console boundary in the map would collapse into one target
# called `node`. A package this tool cannot say anything true about is left to the name
# rules, which can at least say what was passed.
#
# **`@types/foo` is `foo`.** A package that ships no types of its own declares them in a
# separate one, and they are the same dependency — measured on uigen, where `@types/bcrypt`
# is the only spelling `bcrypt` ever has. A trailing slash makes an entry a **scope**:
# `@aws-sdk/` matches every package in it and `stripe` never matches `stripe-webhooks`.
#
# `target` says what to call the thing touched, and `package` is the default: the
# dependency is the thing, and the expression as written is already the evidence.
# `receiver_tail` is for the one shape where the program names something more specific in
# the middle of the call — `db.booking.findMany(…)` touches **booking**, and 130 of
# DunneCorp's rows are that shape.
packages:
  # -- databases -------------------------------------------------------------- #
  # `.prisma` is not a typo: a generated Prisma client's types live in
  # `node_modules/.prisma/client`, and that is where 130 of DunneCorp's calls resolve to.
  # `@prisma/client` is where the rest of them land.
  ".prisma":        {kind: DATABASE, direction: BOTH, salience: high, target: receiver_tail}
  "@prisma/client": {kind: DATABASE, direction: BOTH, salience: high, target: receiver_tail}
  "pg":             {kind: DATABASE, direction: BOTH, salience: high}
  "mysql2":         {kind: DATABASE, direction: BOTH, salience: high}
  "better-sqlite3": {kind: DATABASE, direction: BOTH, salience: high}
  "mongodb":        {kind: DATABASE, direction: BOTH, salience: high}
  "mongoose":       {kind: DATABASE, direction: BOTH, salience: high}
  "drizzle-orm":    {kind: DATABASE, direction: BOTH, salience: high}
  "knex":           {kind: DATABASE, direction: BOTH, salience: high}
  "@supabase/":     {kind: DATABASE, direction: BOTH, salience: high}

  # -- network ---------------------------------------------------------------- #
  # 6 calls each in DunneCorp, and neither is reachable by name: `getStripe()` is a factory
  # and `resend` is a local `const`.
  "stripe":         {kind: NETWORK, direction: BOTH, salience: high}
  "resend":         {kind: NETWORK, direction: OUT,  salience: high}
  "axios":          {kind: NETWORK, direction: BOTH, salience: high}
  "ky":             {kind: NETWORK, direction: BOTH, salience: high}
  "got":            {kind: NETWORK, direction: BOTH, salience: high}
  "undici":         {kind: NETWORK, direction: BOTH, salience: high}
  "node-fetch":     {kind: NETWORK, direction: BOTH, salience: high}

  # -- cloud SDKs ------------------------------------------------------------- #
  # **`@smithy/` is here because the measurement put it here.** `doc.send(new
  # UpdateCommand(…))` is the one call that actually reaches DynamoDB, and `.send` is
  # declared by smithy — AWS's own protocol library — rather than by `@aws-sdk/lib-dynamodb`,
  # which declares the command. A table holding only `@aws-sdk/` catches the construction
  # and misses the request.
  "@aws-sdk/":      {kind: CLOUD_SDK, direction: BOTH, salience: high}
  "@smithy/":       {kind: CLOUD_SDK, direction: BOTH, salience: high}
  "@google-cloud/": {kind: CLOUD_SDK, direction: BOTH, salience: high}
  "firebase-admin": {kind: CLOUD_SDK, direction: BOTH, salience: high}

  # -- large-model APIs ------------------------------------------------------- #
  # uigen, which is the only tree here that calls one: `ai` 4, `@ai-sdk/anthropic` 1.
  "ai":             {kind: LLM_API, direction: BOTH, salience: high}
  "@ai-sdk/":       {kind: LLM_API, direction: BOTH, salience: high}
  "@anthropic-ai/": {kind: LLM_API, direction: BOTH, salience: high}
  "openai":         {kind: LLM_API, direction: BOTH, salience: high}

  # -- cryptography ----------------------------------------------------------- #
  # `bcryptjs` 4 in DunneCorp, `bcrypt` 2 and `jose` 7 in uigen.
  "bcryptjs":       {kind: CRYPTO, direction: BOTH, salience: high}
  "bcrypt":         {kind: CRYPTO, direction: BOTH, salience: high}
  "argon2":         {kind: CRYPTO, direction: BOTH, salience: high}
  "jose":           {kind: CRYPTO, direction: BOTH, salience: high}
  "jsonwebtoken":   {kind: CRYPTO, direction: BOTH, salience: high}

# -- React: the callback that is work, and the word a file says about itself ---- #
#
# **A hook's callback is a routine.** `useEffect(() => { … }, [deps])` is where a React
# component does the things this tool exists to record — a fetch, a subscription, a write
# — and chunk 9 filed every one of them under the component that merely *declares* the
# effect. The callback is nested in the component, so its qualname carries it (rule 10).
#
# The name is stated and never invented (rule 30), and there are two readings because the
# source has two: where the hook's call is bound to a name, that is the routine's name
# (`const createFile = useCallback(…)` is **createFile**); where it is not, the routine is
# the hook's own word, which is written at that line (`useEffect`, and `useEffect#2` for a
# second one in the same component — `Extractor.identity`'s disambiguation, not a new one).
#
# **The population is small and is stated rather than implied**: 4 in DunneCorp, 16 in
# uigen, 0 in DunneNote — 20 over every TypeScript tree here. `useEffect` *as a rate* is a
# second feature and is deferred: judging it needs the dependency array read as part of the
# judgement, which `resolve/shape.py` has no vocabulary for.
hooks:
  callbacks: [useEffect, useLayoutEffect, useInsertionEffect, useCallback, useMemo]

# **A directive prologue marks the thing below it, which is what a decorator is**, so it is
# recorded in `routines.decorators` and needs no column of its own. That is what makes two
# holes this map deliberately leaves answerable by query rather than by assertion:
# `"use server"` actions are not claimed as ways in, and the map says how many there are.
#
# **Each one carries the sentence the map prints about it**, because the renderer is
# language-agnostic and the words are not: what `"use server"` means is TypeScript's to
# say, and a sentence about React written into `render/markdown.py` would be a claim no
# language could edit. `claimed: false` is what puts it under *Not claimed as a way in*
# in the Ways in chapter, with its count and the query that returns it (design rule 13).
#
# `"use strict"` is deliberately **not** here. It is a real directive and says nothing
# about what moves, and putting it on every routine of a legacy file is noise in the one
# column that otherwise says something (rule 1).
directives:
  "use client":
    says: >-
      marks a module that runs in the browser as well as on the server. Its exports are
      components and event handlers, which are already routines here.
  "use server":
    claimed: false
    says: >-
      marks a module whose exports are called across the wire, which is what HTTP_ROUTE
      means — so these are ways in, and are not claimed as them. Nothing in the tree says
      which of a module's exports a client actually calls, and claiming every export of
      every action file would put names in "Where to start" that no request ever reaches
      (rule 1). Recorded and not claimed, rather than silently absent.

# -- ways in a framework declares by where a file sits ------------------------- #
#
# **A Next.js App Router page is a way in, and nothing in the file says so.** There is no
# decorator, no registration call and no export name: the *path* is the declaration, and
# `app/(marketing)/services/[slug]/page.tsx` means the URL `/services/[slug]`. That is a
# convention rather than a guess — it is how the framework routes, and a reader who did not
# know it would find 33 components with nothing calling them and no way in to the program
# at all.
#
# The names here are data and the derivation is code, exactly as `boundaries` above splits
# them. Teaching this file SvelteKit's `+page.svelte` or Remix's `routes/` is an edit here.
#
# **A route group vanishes, and that is the one thing to get right.** `(marketing)` exists
# to share a layout and is not a URL segment, so a `(…)` surviving into a route name is a
# name no reader can type into a browser — the first thing anybody who writes Next.js
# checks. A dynamic segment is the opposite: `[slug]` and `[...nextauth]` are kept exactly
# as written, because the program's own word for that hole is the only name it has.
routes:
  - framework: Next.js App Router
    kind: HTTP_ROUTE
    # Both layouts are in the wild and neither outranks the other: DunneCorp puts `app/` at
    # the root, uigen puts it under `src/`. The deepest match wins, so a directory called
    # `app` nested inside a `src/app` route tree cannot be read as a second root.
    roots: [app, src/app]
    pages: [page.tsx, page.ts, page.jsx, page.js]
    handlers: [route.ts, route.tsx, route.js]
    # A handler file is named by the verbs it exports, because that is what it declares:
    # one file serves as many methods as it exports functions.
    verbs: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
    strip_groups: true
    evidence: Next.js App Router

# **A promise whose result is discarded still runs.** `fetch(u)` makes the request the
# moment it is called; dropping the promise loses the ordering, and without a `.catch` the
# failure, but the work happens. So an un-awaited async call here is not work that did not
# happen -- it is a risk, and often a deliberate one: gstack's is three lines under the
# comment *"No await; this is fire-and-forget"* and ends in `.catch(() => {})`.
unawaited_async: runs

network:
  # **`async` here means *this call returns a promise*, and it is read by exactly one
  # judgement: whether a discarded result is a defect.** Two of these said `true` of a
  # **constructor**, which was a false statement with a visible cost -- gstack's
  # `new WebSocket(wsUrl)` came out of `dunneflow check` as a BROKEN *"never awaited"*, in
  # the command that gates CI on BROKEN. Read off the bundled `lib.dom.d.ts`, which is the
  # authority this reader already carries: `new(url: string | URL, protocols?: string |
  # string[]): WebSocket` and `new(url: string | URL, eventSourceInitDict?:
  # EventSourceInit): EventSource`. Neither returns a promise; you attach handlers to what
  # comes back. Rule 24 -- the field has to mean what it says.
  #
  # **`socket.emit` is left as it stands and that is a stated residue, not an oversight.**
  # `emit` is fire-and-forget in socket.io and `emitWithAck` is the awaitable one, so it is
  # probably wrong here too -- but socket.io's types are in no corpus this tool has read
  # and no map holds a single `socket.emit`, so there is nothing to check a change against.
  # Asserting it from memory is the thing rule 24 forbids.
  libraries:
    fetch: {protocol: HTTP, async: true}
    globalThis.fetch: {protocol: HTTP, async: true}
    window.fetch: {protocol: HTTP, async: true}
    "axios.": {protocol: HTTP, async: true}
    "ky.": {protocol: HTTP, async: true}
    "got.": {protocol: HTTP, async: true}
    "undici.": {protocol: HTTP, async: true}
    "superagent.": {protocol: HTTP, async: true}
    "http.request": {protocol: HTTP, async: false}
    "https.request": {protocol: HTTPS, async: false}
    "http.get": {protocol: HTTP, async: false}
    "https.get": {protocol: HTTPS, async: false}
    WebSocket: {protocol: WS, async: false}
    EventSource: {protocol: HTTP, async: false}
    "socket.emit": {protocol: WS, async: true}
  verbs: [get, post, put, patch, delete, head, options, request]
  # The option-bag keys a request carries, read only where they are written literally.
  kwargs:
    timeout: [timeout, timeoutMs, signal]
    retries: [retry, retries, maxRetries]
    tls: [rejectUnauthorized, agent, ca]
    payload: [body, data, json, form]
    headers: [headers]

# Which extensions name a file the program uses. Read **host-side**, by
# `ingest/literals.py`, which is why a `.parquet` added here costs no plugin rebuild.
# Deliberately not a copy of python.yaml's: a TypeScript program names `.ts` and `.mjs`
# files, and a Python one does not.
artefacts:
  extensions:
    DATABASE: [db, sqlite, sqlite3, duckdb]
    CONFIG: [json5, yaml, yml, toml, ini, cfg, conf, env, editorconfig, npmrc, nvmrc]
    SCRIPT: [ts, tsx, js, jsx, mjs, cjs, mts, cts, sh, bash, zsh, ps1, bat]
    DOCUMENT: [md, mdx, rst, txt, adoc, pdf, html, htm]
    DATA: [json, jsonl, ndjson, csv, tsv, xml, parquet, avro, proto, wasm]
    ARCHIVE: [zip, tar, gz, tgz, bz2, xz, zst, 7z]
    STYLE: [css, scss, sass, less]

# Same as Python's: a second `function foo` at one scope replaces the first. TypeScript
# *declaration* overloads are a different thing — several signatures over one
# implementation — and the reader already records an overload set as one name.
redefinition: shadows

# **What `private` means here, for the naming lane's LEAKAGE claim** (`RuleSet.private_means`):
# `_name` and `#name`, the only two the reader records as private, are kept inside their file or class.
private_means: module
