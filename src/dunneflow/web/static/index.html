<!doctype html>
<meta charset="utf-8">
<title>DunneFlow</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/tokens.css">

<!--
  The ratified shell, now reading from the store.

  Every count on this page is a measurement over `graph.db`. Nothing is pinned:
  the navigator, the cover and the top bar are all generated from `/api/cover`,
  because a dashboard that ships one program's numbers inside it will show them
  to the next program too, confidently and wrongly.

  The 2.5D graph is a view inside this page, not a page of its own. There is no
  iframe: WebGL has no requirement to be the top-level document, deck.gl mounts
  into any div, and an iframe would cut the single shared selection in half --
  turning "click a routine in the text, see it in the graph" into a postMessage
  protocol, which is the one interaction the whole design is built around.
-->



<a class="skip-link" href="#main">Skip to main view</a>

<div class="app">

  <!-- ══════════ TOP BAR ══════════ -->
  <header class="topbar">
    <div class="brand">
      <b>DunneFlow</b>
      <span>by DunneCorp LLC</span>
    </div>

    <label class="sr-only" for="prog">Program</label>
    <select class="tb-select" id="prog"></select>

    <!-- The title is filled from the served root by loadCover(); pinning one here put
         one developer's disk in a tooltip on every other machine. -->
    <button class="srcpath" id="srcPath" aria-expanded="false">
      <span class="srcpath-k">source directory</span>
      <span class="srcpath-v" id="srcPathV"></span>
    </button>

    <label class="sr-only" for="rev">Revision</label>
    <select class="tb-select" id="rev">
      <option>current</option>
      <option disabled>— layers not built yet —</option>
    </select>

    <label class="sr-only" for="search">Search routines, boundaries, tables</label>
    <input class="tb-search" id="search" type="search" placeholder="Search routines, tables, boundaries…   /">

    <div class="tb-right">
      <div class="scale-group">
        <span class="sm" aria-hidden="true">A</span>
        <input type="range" id="scaleSlider" class="scaleslider"
               min="0.75" max="1.75" step="0.0625" value="1"
               aria-label="Interface scale" aria-valuetext="100 percent">
        <span class="lg" aria-hidden="true">A</span>
        <span class="scale-val num" id="scaleVal">100%</span>
      </div>
      <button class="tb-btn" id="themeBtn" aria-label="Theme: system">◐ System</button>
      <button class="tb-btn" id="settingsBtn" aria-pressed="false">⚙ Settings</button>
    </div>
  </header>

  <div class="body">

    <!-- ══════════ NAVIGATOR ══════════ -->
    <!-- Two elements, not one: a collapsed pane must leave something behind that says
         where it went and gives it back. A pane that simply disappears is a silent
         filter, which design rule 1 forbids, and the reader has no way to know the
         layout is a choice rather than the product. -->
    <!-- The divider between the navigator and the centre. A separate element rather than a
         border on the pane, because it needs a hit area wider than a hairline and must not
         move when the pane scrolls. -->
    <div class="navgrip" id="navGrip" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="Resize the navigator"></div>
    <button class="rail rail-left" id="navigatorRail" data-pane="navigator"
            hidden aria-expanded="false" aria-controls="navigator"
            title="Show the navigator"><span class="railtext">Navigator</span></button>
    <nav class="navigator" id="navigator" aria-label="Program navigator">
      <!-- generated by buildNav() from /api/cover: the counts are the program's,
           not this file's. A pinned navigator is a confident lie about a codebase
           nobody has read. -->
    </nav>

    <!-- ══════════ CENTRE ══════════ -->
    <main class="centre" id="main">

      <div class="crumbbar">
        <div class="crumbs" id="crumbs"></div>
        <!-- Two drawings of one selection, not a fourth mode. The stack holds ten
             thousand nodes and answers what is in here; the overview holds forty boxes
             and answers what this is shaped like. Both were always the plan. -->
        <div class="modes" role="group" aria-label="Graph layout" id="layouts" hidden>
          <button data-layout="stack" aria-pressed="true">Stack</button>
          <button data-layout="packages" aria-pressed="false">Overview</button>
        </div>
        <div class="modes" role="group" aria-label="View mode" id="modes">
          <button data-mode="graph" aria-pressed="true">Graph</button>
          <button data-mode="table" aria-pressed="false">Table</button>
          <button data-mode="doc" aria-pressed="false">Document</button>
          <button data-mode="code" aria-pressed="false">Code</button>
        </div>
      </div>

      <div id="trailMount"></div>

      <!-- ═══ THE FILTER STRIP ═══ -->
      <div class="filterstrip" id="filterstrip">
        <span class="fs-label">Filtered</span>
        <div class="chips" id="chips"></div>
        <span class="fs-counts">showing <b id="fsShown">0</b> of <b id="fsTotal">0</b> routines</span>
        <span class="fs-hidden" id="fsHidden"></span>
        <div class="fs-actions">
          <button class="linkbtn" id="showHidden" aria-expanded="false">Show hidden</button>
          <button class="linkbtn" id="clearFilters">Clear all</button>
        </div>
        <div class="hiddenlist" id="hiddenList" hidden></div>
      </div>

      <!--
        Two permanent children, and the split is load-bearing.

        `render()` fills `#viewMount` with innerHTML on every keystroke. A deck.gl
        canvas cannot live there: it would be destroyed and rebuilt continuously,
        losing its GL context, its camera and the reader's place in the program.
        So the graph gets a mount `render()` never touches, and mode swaps which of
        the two is on screen.
      -->
      <div class="viewport" id="viewport">
        <!--
          The legend is a *pane*, not an overlay, and the mount is a grid so that its
          column can collapse rather than its contents (design rule 24, and the same
          reason `.body` puts the state on the track: a pane hidden while its column
          stayed 26rem would leave a 26rem hole).

          `.graphcanvas` exists so the stage and the HUD share a containing block that
          is only the drawable area. `Graph.mount()` is handed `#graphStage`, so its
          `clientWidth` is now the width the stack can actually use — which is what lets
          `fitView` frame with plain arithmetic instead of the `0.60 : 0.90` fudge the
          pre-merge engine needed while the legend sat on top of the picture.
        -->
        <div class="graphmount" id="graphMount" hidden>
          <div class="graphcanvas">
            <div class="graphstage" id="graphStage"></div>
            <div class="graphhud" id="graphHud"></div>
            <!--
              The pop-up. It lives here, beside the stage rather than inside `#viewMount`,
              for the same reason the canvas does: `render()` rewrites that mount on every
              keystroke, and a card rebuilt under the cursor is a card that flickers and
              loses its place. `.graphcanvas` is also the box deck.gl reports hover
              coordinates against, so positioning is arithmetic rather than a correction.
            -->
            <div class="hovercard" id="hoverCard" hidden aria-hidden="true"></div>
          </div>
          <aside class="graphlegend" id="graphLegend" aria-label="Plates"></aside>
          <button class="rail rail-right" id="legendRail" data-pane="legend"
                  hidden aria-expanded="false" aria-controls="graphLegend"
                  title="Show the plates"><span class="railtext">Plates</span></button>
        </div>
        <div class="viewmount" id="viewMount"></div>
      </div>
    </main>

    <!-- ══════════ INSPECTOR ══════════ -->
    <aside class="inspector" aria-label="Inspector" id="inspector"></aside>
    <button class="rail rail-right" id="inspectorRail" data-pane="inspector"
            hidden aria-expanded="false" aria-controls="inspector"
            title="Show the inspector"><span class="railtext">Inspector</span></button>

  </div>
</div>

<!--
  The navigator's pop-up. Body level, and that is structural rather than tidy: the
  navigator scrolls its own content, so a card inside it is clipped by that scroller
  at exactly the rows nearest the edges -- which is most of them, since the pane is
  a long list. Fixed positioning against the window is the only place it can be whole.

  A second element rather than a second card: the markup, the fetch, the dwell and the
  cache are all the graph card's, and the only things that differ are where it is
  anchored and what is free to draw before the server answers.
-->
<div class="hovercard navcard" id="navCard" hidden aria-hidden="true"></div>


<!--
  Order matters and is not incidental. deck.gl defines the `deck` global that
  `shading.js` and `graph.js` both read at parse time, and `shell.js` reads
  `window.DunneFlowGraph` when it mounts. These are classic scripts sharing one
  global scope, which is why each of the three wraps itself in an IIFE and exports
  exactly one name.
-->
<script src="/vendor/deck.gl.min.js"></script>
<script src="/static/settings.js"></script>
<script src="/static/shading.js"></script>
<script src="/static/graph.js"></script>
<script src="/static/shell.js"></script>
