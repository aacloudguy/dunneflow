<!doctype html>
<meta charset="utf-8">
<title>DunneFlow</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
<div id="stage"></div>

<section id="panel-hud" class="panel left">
  <header data-panel="hud"><span class="chev"></span>view</header>
  <div class="body">
    <div class="row"><b id="fps">–</b> fps<span id="mode" class="tag">still</span></div>
    <div class="row" id="counts">loading…</div>
    <div class="row muted" id="hint">drag orbit · scroll zoom</div>
    <div class="row">
      <button data-act="fit" title="frame the selection, or the whole stack (f)">snap to fit</button>
      <button data-act="top">top-down</button>
      <button data-act="tilt">tilt</button>
      <button data-act="bench">benchmark</button>
      <button data-act="clear" id="clear" hidden title="clear the selection (esc)">clear</button>
    </div>
    <div class="row" id="bench"></div>
    <div class="row err" id="err" hidden></div>
    <div class="row diag" id="diag"></div>
  </div>
</section>

<section id="panel-settings" class="panel left">
  <header data-panel="settings"><span class="chev"></span>settings</header>
  <div class="body">
    <div class="row">
      <label for="size">node size</label>
      <input id="size" type="range" min="0.4" max="14" step="0.2" value="1">
      <span id="sizeval" class="muted">1.0×</span>
    </div>
    <div class="row">
      <label for="spread">spread</label>
      <input id="spread" type="range" min="0.05" max="2" step="0.05" value="0.35">
      <span id="spreadval" class="muted">0.35×</span>
    </div>
    <div class="row">
      <label for="filter">others</label>
      <select id="filter"><option value="dim">dim</option><option value="hide">hide</option></select>
      <label for="direction">follow</label>
      <select id="direction">
        <option value="both">both ways</option>
        <option value="callers">callers</option>
        <option value="callees">callees</option>
      </select>
    </div>
    <div class="row">
      <label for="colorby">colour by</label>
      <select id="colorby"><option value="kind">kind</option><option value="disk">disk</option></select>
      <label><input id="plates" type="checkbox"> <span class="muted">plates</span></label>
    </div>
    <div class="row">
      <button data-act="reset" title="clear every stored setting for this program">reset to defaults</button>
    </div>
  </div>
</section>

<section id="panel-disks" class="panel right">
  <header data-panel="disks"><span class="chev"></span>disks &amp; search</header>
  <div class="body">
    <div class="row">
      <input id="q" type="search" placeholder="search names, modules, files, kinds…  ( / )">
    </div>
    <div class="row muted" id="searchnote"></div>
    <div id="results"></div>
    <div class="row">
      <label for="sort">sort</label>
      <select id="sort">
        <option value="nodes">by size</option>
        <option value="name">by name</option>
        <option value="kind">by kind</option>
        <option value="manual">manual (drag)</option>
      </select>
      <span class="muted tiny">click toggles · pick two to see what crosses · drag reorders</span>
    </div>
    <div id="menu"></div>
  </div>
</section>

<script src="/vendor/deck.gl.min.js"></script>
<script src="/static/settings.js"></script>
<script src="/static/shading.js"></script>
<script src="/static/app.js"></script>
